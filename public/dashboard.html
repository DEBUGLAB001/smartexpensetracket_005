<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Smart Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body fade-in">
    <nav class="navbar glass-panel">
        <h2 class="gradient-text">Expense Tracker</h2>
        <div class="user-controls">
            <span id="user-name-display"></span>
            <button id="btn-logout" class="btn-outline">Log Out</button>
        </div>
    </nav>

    <main class="dashboard-grid">
        <!-- Summary Section -->
        <section class="summary-cards">
            <div class="card glass-panel slide-up" style="animation-delay: 0.1s;">
                <h3>Net Balance</h3>
                <h2 id="summary-balance" class="gradient-text">$0.00</h2>
            </div>
            <div class="card glass-panel slide-up" style="animation-delay: 0.2s;">
                <h3>Total Income</h3>
                <h2 id="summary-income" class="text-success">$0.00</h2>
            </div>
            <div class="card glass-panel slide-up" style="animation-delay: 0.3s;">
                <h3>Total Expenses</h3>
                <h2 id="summary-expense" class="text-danger">$0.00</h2>
            </div>
        </section>

        <div class="main-content row">
            <!-- Left Column: Wallets & Budgets -->
            <div class="col-left">
                <section class="glass-panel slide-up" style="animation-delay: 0.4s;">
                    <div class="section-header">
                        <h3>My Wallets</h3>
                        <button class="btn-sm" id="btn-add-wallet">+ New</button>
                    </div>
                    <ul id="wallets-list" class="item-list"></ul>
                </section>

                <section class="glass-panel slide-up" style="animation-delay: 0.5s;">
                    <div class="section-header">
                        <h3>Budgets (This Month)</h3>
                        <button class="btn-sm" id="btn-add-budget">+ New</button>
                    </div>
                    <div id="budgets-list"></div>
                </section>
            </div>

            <!-- Right Column: Expenses -->
            <div class="col-right">
                <section class="glass-panel slide-up" style="animation-delay: 0.6s;">
                    <div class="section-header">
                        <h3>Recent Transactions</h3>
                        <button class="btn-primary btn-sm glow-effect" id="btn-add-expense">+ Add Transaction</button>
                    </div>
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Category</th>
                                    <th>Date</th>
                                    <th>Amount</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="transactions-list">
                                <!-- Transactions injected here -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- Modal: Add Transaction -->
    <div id="modal-expense" class="modal hidden">
        <div class="modal-content glass-panel drop-in">
            <h3>Add Transaction</h3>
            <form id="form-expense">
                <div class="input-group">
                    <label>Type</label>
                    <select id="exp-type" required>
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Wallet</label>
                    <select id="exp-wallet" required></select>
                </div>
                <div class="input-group">
                    <label>Title</label>
                    <input type="text" id="exp-title" required>
                </div>
                <div class="input-group">
                    <label>Amount</label>
                    <input type="number" id="exp-amount" step="0.01" required>
                </div>
                <div class="input-group">
                    <label>Category</label>
                    <select id="exp-category" required>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Education">Education</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Health">Health</option>
                        <option value="Entertainment">Entertainment</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-outline close-modal">Cancel</button>
                    <button type="submit" class="btn-primary glow-effect">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
